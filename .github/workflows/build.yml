name: Build UHFDemo EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Retarget All Projects to .NET 4.8
      run: |
        Get-ChildItem -Filter *.csproj -Recurse | ForEach-Object {
          (Get-Content $_.FullName) -replace '<TargetFrameworkVersion>v4.6.1</TargetFrameworkVersion>', '<TargetFrameworkVersion>v4.8</TargetFrameworkVersion>' | Set-Content $_.FullName
          Write-Host "Успішно оновлено: $($_.Name)"
        }
      shell: powershell

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v1

    - name: Restore NuGet Packages
      run: nuget restore uhfreader.sln
      continue-on-error: true

    - name: Inject Missing MySQL Dependency
      # Примусово завантажуємо стабільну версію драйвера MySQL і знаходимо шлях до DLL
      run: |
        nuget install MySql.Data -Version 6.10.9 -OutputDirectory custom_packages
        $dllFolder = (Get-ChildItem -Path custom_packages -Filter MySql.Data.dll -Recurse | Select-Object -First 1).DirectoryName
        Write-Host "Шлях до MySQL DLL: $dllFolder"
        echo "MYSQL_PATH=$dllFolder" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      shell: powershell

    - name: Build UHFDemo Project Only
      # Передаємо шлях до знайденої DLL через параметр ReferencePath
      run: msbuild UHFDemo/UHFDemo.csproj /p:Configuration=Release /p:ReferencePath="${{ env.MYSQL_PATH }}" /v:m

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UHFDemo-Compiled
        path: |
          **/bin/Release/
          **/bin/x86/Release/
