name: Build UHFDemo EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v1

    - name: Restore NuGet Packages
      run: nuget restore uhfreader.sln
      continue-on-error: true

    - name: Build UHFDemo Project Only
      # Дозволяємо MSBuild самому обрати правильну архітектуру (x86 або AnyCPU), закладену автором
      run: msbuild UHFDemo/UHFDemo.csproj /p:Configuration=Release /v:m

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UHFDemo-Compiled
        path: |
          **/bin/Release/
          **/bin/x86/Release/
