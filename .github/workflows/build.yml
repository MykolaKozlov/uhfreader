name: Build UHFDemo EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Retarget All Projects to .NET 4.8
      run: |
        Get-ChildItem -Filter *.csproj -Recurse | ForEach-Object {
          (Get-Content $_.FullName) -replace '<TargetFrameworkVersion>v4.6.1</TargetFrameworkVersion>', '<TargetFrameworkVersion>v4.8</TargetFrameworkVersion>' | Set-Content $_.FullName
          Write-Host "Успішно оновлено фреймворк: $($_.Name)"
        }
      shell: powershell

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v1

    - name: Fix and Inject MySQL Dependency
      run: |
        # 1. Завантажуємо пакет драйвера
        nuget install MySql.Data -Version 6.10.9 -OutputDirectory custom_packages
        
        # 2. Знаходимо файл проекту та скидаємо сувору перевірку версії через регулярні вирази
        $csproj = "UHFDemo/UHFDemo.csproj"
        $content = Get-Content $csproj -Raw
        
        # Паттерн знаходить весь тег <Reference Include="MySql.Data...">...</Reference> незалежно від версії
        $pattern = '(?s)<Reference Include="MySql\.Data[^>]*">.*?</Reference>'
        
        # Заміняємо його на «м'яке» посилання, що вказує на наш завантажений файл
        $replacement = '<Reference Include="MySql.Data"><HintPath>..\custom_packages\MySql.Data.6.10.9\lib\net452\MySql.Data.dll</HintPath></Reference>'
        
        if ($content -match $pattern) {
            $content -replace $pattern, $replacement | Set-Content $csproj
            Write-Host "Логіку посилань MySQL успішно виправлено в .csproj!"
        } else {
            Write-Warning "Не вдалося знайти тег Reference для MySql.Data, можливо він записаний інакше."
        }
      shell: powershell

    - name: Build UHFDemo Project Only
      run: msbuild UHFDemo/UHFDemo.csproj /p:Configuration=Release /v:m

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UHFDemo-Compiled
        path: |
          **/bin/Release/
          **/bin/x86/Release/
