name: Build UHFDemo EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v1

    - name: Restore NuGet Packages
      run: nuget restore uhfreader.sln
      continue-on-error: true # Ігноруємо помилки відновлення пакетів, якщо вони застаріли

    - name: Build UHFDemo Project Only
      # Збираємо конкретно папку з додатком, ігноруючи зламані залежності рішення (.sln)
      run: msbuild UHFDemo/UHFDemo.csproj /p:Configuration=Release /p:Platform="AnyCPU"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UHFDemo-Compiled
        path: |
          **/bin/Release/
